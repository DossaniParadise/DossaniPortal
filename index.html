<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Dossani Portal</title>
  <meta name="description" content="Dossani Paradise Management — one portal for every team. Every operating system in one place." />

  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Dossani Portal" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#1b1660" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Decide the sign-in gate's opening state BEFORE first paint. Without this,
       a returning District Manager sees the board flash behind the gate for a
       frame. "gate-off" simply means "this browser already made a choice". -->
  <script>
    (function(){
      try{
        var s=JSON.parse(localStorage.getItem("dpm_dm_portal_session")||"null");
        if(s&&s.email)document.documentElement.classList.add("gate-off");
      }catch(e){}
    })();
  </script>

  <style>
    :root{
      --navy-950:#0d0a35; --navy-900:#14104a; --navy-800:#1b1660; --navy-700:#251d7f;
      --navy-600:#322aa0; --navy-500:#4339c4; --navy-400:#6c63d8; --navy-300:#9d97e6;
      --navy-200:#c7c3f1; --navy-100:#e6e4f9; --navy-50:#f2f1fc;
      --red-700:#c60819; --red-600:#e8091b;
      --gray-900:#14161f; --gray-800:#23262f; --gray-500:#6b6f7d; --gray-400:#939aa8;
      --gray-300:#c2c6d0; --gray-200:#dee1e8; --gray-100:#eef0f4; --gray-50:#f7f8fb;

      --primary:var(--navy-700); --accent:var(--red-600);
      --text-heading:var(--navy-800); --text-body:var(--gray-800);
      --text-muted:var(--gray-500); --text-subtle:var(--gray-400);
      --surface-page:var(--gray-50); --surface-card:#ffffff;
      /* 40% brand red; --alert-ink is the darkest text that stays readable on it */
      --alert-wash:rgba(232,9,27,.4); --alert-ink:#6d1520;
      --border-subtle:var(--gray-200); --divider:var(--gray-200);

      --font-display:'Cinzel','Trajan Pro','Times New Roman',serif;
      --font-serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
      --font-sans:'Mulish',system-ui,-apple-system,'Segoe UI',sans-serif;
      --tracking-wide:0.04em; --tracking-wider:0.12em; --tracking-widest:0.22em;

      --radius-md:6px; --radius-lg:10px; --radius-xl:16px; --radius-pill:999px;
      --gap:0.72rem;
      --shadow-sm:0 1px 3px rgba(20,16,74,.08),0 1px 2px rgba(20,16,74,.06);
      --shadow-md:0 4px 12px rgba(20,16,74,.10),0 2px 4px rgba(20,16,74,.06);
      --shadow-lg:0 12px 28px rgba(20,16,74,.14),0 4px 10px rgba(20,16,74,.08);
      --shadow-navy:0 12px 26px rgba(37,29,127,.30);
      --ease:cubic-bezier(.16,1,.3,1);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-body);
      line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}

    /* DPM plate */
    .plate{display:inline-flex;flex-direction:column;align-items:center;background:var(--navy-700);
      border:3px solid var(--accent);border-radius:var(--radius-lg);box-shadow:var(--shadow-navy);
      padding:.4rem .9rem .46rem;}
    .plate .dpm{font-family:var(--font-display);font-weight:700;color:#fff;letter-spacing:.13em;
      line-height:1;font-size:1.5rem;}
    .plate .plate-rule{width:28px;height:3px;background:var(--accent);border-radius:2px;margin-top:.35rem;}
    .plate.mini{flex-direction:row;padding:.28rem .5rem;border-width:2px;border-radius:7px;box-shadow:none;}
    .plate.mini .dpm{font-size:.98rem;letter-spacing:.1em;}
    .plate.mini .plate-rule{display:none;}

    /* Top bar */
    .topbar{position:sticky;top:0;z-index:50;background:rgba(20,16,74,.82);
      backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);
      border-bottom:1px solid rgba(199,195,241,.16);}
    .topbar-inner{max-width:1200px;margin:0 auto;padding:.6rem 1.5rem;display:flex;align-items:center;gap:1rem;}
    .topbar-brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;}
    .topbar-word{font-family:var(--font-display);font-weight:600;color:#fff;font-size:.95rem;
      letter-spacing:var(--tracking-wide);white-space:nowrap;}
    .topbar-search{margin-left:auto;}
    .topbar-search .field{width:250px;}

    /* Hero */
    .hero{position:relative;overflow:hidden;color:#fff;border-bottom:1px solid rgba(199,195,241,.14);
      background:
        radial-gradient(120% 120% at 88% -40%, rgba(232,9,27,.18), transparent 55%),
        radial-gradient(90% 120% at 6% 140%, rgba(67,57,196,.32), transparent 55%),
        linear-gradient(158deg, var(--navy-900) 0%, var(--navy-800) 55%, var(--navy-700) 100%);}
    .hero::after{content:"DPM";position:absolute;right:-1rem;bottom:-2.4rem;font-family:var(--font-display);
      font-weight:900;font-size:9rem;color:rgba(199,195,241,.06);letter-spacing:.05em;pointer-events:none;
      line-height:.8;user-select:none;}
    .hero-inner{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:1.15rem 1.5rem 1.25rem;
      display:flex;flex-direction:column;align-items:center;text-align:center;}
    .hero .plate{margin-bottom:.65rem;}
    .eyebrow{font-family:var(--font-display);font-weight:600;font-size:.7rem;
      letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--navy-200);
      display:inline-flex;align-items:center;gap:.55rem;margin-bottom:.55rem;}
    .eyebrow::before,.eyebrow::after{content:"";width:18px;height:2px;background:var(--accent);
      border-radius:2px;opacity:.9;}
    .hero h1{font-family:var(--font-display);font-weight:700;color:#fff;font-size:clamp(1.6rem,3.4vw,2.4rem);
      line-height:1.04;letter-spacing:var(--tracking-wide);}

    /* Who's using the portal. Lives in the hero because the top bar is hidden
       by the fit-to-window stage. */
    .who{display:inline-flex;align-items:center;gap:.5rem;margin-top:.6rem;padding:.24rem .34rem .24rem .68rem;
      border-radius:var(--radius-pill);background:rgba(255,255,255,.08);
      border:1px solid rgba(199,195,241,.22);font-size:.76rem;color:var(--navy-100);max-width:100%;}
    .who[hidden]{display:none;}
    .who-dot{width:7px;height:7px;border-radius:50%;background:#3ecf8e;flex-shrink:0;
      box-shadow:0 0 0 3px rgba(62,207,142,.18);}
    .who.is-guest .who-dot{background:var(--gray-400);box-shadow:0 0 0 3px rgba(147,154,168,.18);}
    .who-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
    .who-text b{color:#fff;font-weight:700;}
    .who-btn{font-family:var(--font-sans);font-size:.72rem;font-weight:700;letter-spacing:.02em;
      color:#fff;background:rgba(232,9,27,.9);border:none;border-radius:var(--radius-pill);
      padding:.24rem .7rem;cursor:pointer;flex-shrink:0;transition:background .15s ease,transform .15s ease;}
    .who-btn:hover{background:var(--red-600);transform:translateY(-1px);}
    .who-btn:focus-visible{outline:2px solid #fff;outline-offset:2px;}

    /* Search field (top bar only) */
    .field{display:flex;align-items:center;gap:.6rem;border-radius:var(--radius-lg);padding:0 .8rem;
      transition:box-shadow .18s ease,border-color .18s ease;
      background:rgba(255,255,255,.1);border:1px solid rgba(199,195,241,.24);}
    .field svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
      flex-shrink:0;stroke:var(--navy-200);}
    .field input{border:none;outline:none;background:none;width:100%;font-family:var(--font-sans);
      font-size:.9rem;color:#fff;padding:.48rem 0;}
    .field input::placeholder{color:var(--navy-200);}
    .field .slash{font-family:var(--font-display);font-size:.7rem;color:var(--navy-200);
      border:1px solid rgba(199,195,241,.3);border-radius:5px;padding:.06rem .38rem;flex-shrink:0;}
    .field:focus-within{border-color:var(--navy-300);box-shadow:0 0 0 3px rgba(199,195,241,.15);}

    /* Board: featured tile on top, then a centred grid */
    main{max-width:1200px;margin:0 auto;padding:1.2rem 1.5rem 0.9rem;}
    .board{max-width:788px;margin:0 auto;}
    .board-top{display:flex;justify-content:center;margin-bottom:var(--gap);}
    .board-top .tile{width:calc((100% - 2 * var(--gap)) / 3);}
    .board-grid{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;}
    .board-grid .tile{width:calc((100% - 2 * var(--gap)) / 3);}

    .tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;
      text-align:center;gap:.5rem;background:var(--surface-card);border:1px solid var(--border-subtle);
      border-radius:var(--radius-lg);padding:.82rem .85rem .78rem;text-decoration:none;color:inherit;
      box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .15s ease;}
    .tile::after{content:"";position:absolute;left:50%;right:50%;bottom:0;height:3px;background:var(--accent);
      transition:left .2s var(--ease),right .2s var(--ease);}
    .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--navy-100);}
    .tile:hover::after{left:22%;right:22%;}
    .tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
    .board-top .tile{border-color:var(--navy-200);box-shadow:var(--shadow-md);
      background:linear-gradient(180deg,var(--navy-50),#fff);}

    /* ---- Tile with pending notifications ---------------------------------
       A 20px badge is easy to miss on a board of 18 tiles, so the whole card
       takes a 40% wash of the brand red. The wash is composited over the card
       colour explicitly rather than set as a translucent background-color,
       because the page behind the tile is grey — a plain rgba() would let that
       grey muddy the result, and would tint the featured tile's gradient
       differently from every other tile. */
    .tile.has-alerts,
    .board-top .tile.has-alerts{
      background:linear-gradient(0deg,var(--alert-wash),var(--alert-wash)),var(--surface-card);
      border-color:rgba(198,8,25,.42);}
    .tile.has-alerts:hover{border-color:rgba(198,8,25,.6);}
    /* --text-muted only clears 2.4:1 on the wash, so the description shifts to
       a dark maroon (5.8:1). The tile name is navy and already clears 8:1. */
    .tile.has-alerts .tile-desc{color:var(--alert-ink);}
    .tile.has-alerts .tile-icon{background:#fff;border-color:rgba(198,8,25,.2);}

    /* The icon needs a non-clipping parent so the PayMi count badge can sit
       proudly outside the icon's rounded corner. .tile-icon itself keeps
       overflow:hidden so logos stay inside their rounded square. */
    .tile-iconwrap{position:relative;display:grid;place-items:center;flex-shrink:0;}
    .tile-badge{position:absolute;top:-7px;right:-9px;z-index:2;min-width:20px;height:20px;
      padding:0 5px;border-radius:var(--radius-pill);background:var(--red-600);color:#fff;
      font-family:var(--font-sans);font-weight:800;font-size:.68rem;line-height:20px;
      text-align:center;letter-spacing:.01em;border:2px solid var(--surface-card);
      box-shadow:0 2px 6px rgba(198,8,25,.42);pointer-events:none;
      font-variant-numeric:tabular-nums;}
    .tile-badge[hidden]{display:none;}

    .tile-icon{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
      overflow:hidden;background:var(--navy-50);border:1px solid var(--navy-100);}
    .tile-icon img{max-width:27px;max-height:27px;width:auto;height:auto;display:block;object-fit:contain;}
    .tile-icon.letter{font-family:var(--font-display);font-weight:700;font-size:1.25rem;color:var(--navy-700);}

    .tile-body{min-width:0;width:100%;}
    .tile-name{font-family:var(--font-sans);font-weight:700;font-size:.92rem;color:var(--text-heading);
      line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tile-desc{font-size:.74rem;color:var(--text-muted);margin-top:.18rem;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;}

    .no-results{display:none;text-align:center;padding:2rem 1rem;color:var(--text-muted);font-size:.95rem;}
    .no-results.show{display:block;}
    .no-results strong{color:var(--text-heading);}

    /* Footer */
    footer{border-top:1px solid var(--divider);max-width:1200px;margin:0 auto;padding:1rem 1.5rem 1.2rem;
      display:flex;flex-wrap:wrap;gap:.7rem 1.4rem;align-items:center;justify-content:space-between;
      color:var(--text-muted);font-size:.82rem;}
    footer .f-brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;}
    footer .f-brand .name{font-family:var(--font-display);font-weight:600;color:var(--text-heading);
      letter-spacing:var(--tracking-wide);font-size:.85rem;transition:color .15s ease;}
    footer .f-brand:hover .name{color:var(--accent);}
    footer .updated .tag{color:var(--navy-700);font-weight:700;background:var(--navy-50);
      padding:.12rem .5rem;border-radius:var(--radius-md);margin-left:.3rem;}
    footer .foot-right{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem;}
    footer .version{font-size:.68rem;color:var(--text-subtle);letter-spacing:.05em;font-weight:600;}

    @media (max-width:720px){ .topbar-search{display:none;} .hero::after{font-size:7rem;} }
    @media (max-width:640px){
      .board-grid .tile,.board-top .tile{width:calc((100% - 1 * var(--gap)) / 2);}
    }
    @media (max-width:400px){
      .board-grid .tile,.board-top .tile{width:100%;}
    }
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto;}}
  
    /* ---- Fit-to-window: every app on one screen, scaled to fill the window ---- */
    html,body{height:100%;overflow:hidden;}
    #fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      overflow:hidden;background:var(--surface-page);}
    #stage{transform-origin:center center;width:fit-content;--tilew:240px;--cols:3;}
    #stage .topbar{display:none;}
    #stage main{max-width:none;padding:14px 20px 8px;}
    #stage .board{max-width:none;}
    #stage .hero h1{font-size:2rem;}
    #stage .hero-inner{padding:16px 20px 18px;}
    #stage .board-top{margin-bottom:14px;}
    #stage .board-top .tile{width:var(--tilew);}
    #stage .board-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:0 auto;width:calc(var(--cols) * var(--tilew) + (var(--cols) - 1) * 14px + 2px);}
    #stage .board-grid .tile{width:var(--tilew);}
    #stage footer{max-width:none;padding:10px 20px 14px;}

    /* ---- Sign-in gate ----------------------------------------------------
       Deliberately OUTSIDE #fit so the fit-to-window transform never scales
       or blurs the form. "gate-off" on <html> is the single source of truth
       for whether the gate is showing. ------------------------------------ */
    #gate{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
      padding:1.1rem;overflow:auto;-webkit-overflow-scrolling:touch;
      background:
        radial-gradient(120% 120% at 88% -30%, rgba(232,9,27,.20), transparent 55%),
        radial-gradient(90% 120% at 6% 130%, rgba(67,57,196,.34), transparent 55%),
        linear-gradient(158deg, var(--navy-950) 0%, var(--navy-800) 58%, var(--navy-700) 100%);}
    html.gate-off #gate{display:none;}

    .gate-card{width:100%;max-width:392px;background:var(--surface-card);border-radius:var(--radius-xl);
      box-shadow:0 24px 60px rgba(9,6,32,.5);padding:1.6rem 1.5rem 1.35rem;
      display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto;
      animation:gateIn .32s var(--ease) both;}
    @keyframes gateIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
    .gate-card .plate{margin-bottom:.8rem;}
    .gate-title{font-family:var(--font-display);font-weight:700;color:var(--text-heading);
      font-size:1.16rem;letter-spacing:var(--tracking-wide);line-height:1.2;}
    .gate-sub{font-family:var(--font-serif);font-size:.95rem;color:var(--text-muted);
      margin-top:.3rem;line-height:1.4;font-style:italic;}

    .gate-form{width:100%;margin-top:1.15rem;display:flex;flex-direction:column;gap:.62rem;text-align:left;}
    .gate-label{font-size:.7rem;font-weight:800;letter-spacing:var(--tracking-wider);
      text-transform:uppercase;color:var(--text-muted);margin-bottom:.28rem;display:block;}
    .gate-input{width:100%;font-family:var(--font-sans);font-size:.92rem;color:var(--text-body);
      background:var(--gray-50);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
      padding:.6rem .8rem;outline:none;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;}
    .gate-input:focus{border-color:var(--navy-400);background:#fff;box-shadow:0 0 0 3px rgba(108,99,216,.16);}
    .gate-input::placeholder{color:var(--text-subtle);}
    .gate-input:disabled{opacity:.6;cursor:not-allowed;}

    .gate-btn{width:100%;font-family:var(--font-sans);font-weight:800;font-size:.86rem;
      letter-spacing:var(--tracking-wide);color:#fff;background:var(--navy-700);border:none;
      border-radius:var(--radius-lg);padding:.68rem 1rem;cursor:pointer;margin-top:.2rem;
      display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
      transition:background .16s ease,transform .16s ease,box-shadow .16s ease;}
    .gate-btn:hover:not(:disabled){background:var(--navy-600);transform:translateY(-1px);box-shadow:var(--shadow-navy);}
    .gate-btn:disabled{opacity:.72;cursor:progress;transform:none;}
    .gate-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

    .gate-err{display:none;font-size:.79rem;line-height:1.4;color:#8d1220;background:#fdeaec;
      border:1px solid #f4c2c8;border-left:3px solid var(--red-600);border-radius:var(--radius-md);
      padding:.5rem .68rem;}
    .gate-err.show{display:block;}

    .gate-or{display:flex;align-items:center;gap:.7rem;width:100%;margin:1.05rem 0 .8rem;
      color:var(--text-subtle);font-size:.66rem;font-weight:700;letter-spacing:var(--tracking-wider);
      text-transform:uppercase;}
    .gate-or::before,.gate-or::after{content:"";flex:1;height:1px;background:var(--divider);}

    .gate-guest{width:100%;font-family:var(--font-sans);font-weight:700;font-size:.82rem;
      color:var(--navy-700);background:#fff;border:1px solid var(--navy-200);border-radius:var(--radius-lg);
      padding:.62rem .9rem;cursor:pointer;line-height:1.35;
      transition:background .16s ease,border-color .16s ease,transform .16s ease;}
    .gate-guest:hover{background:var(--navy-50);border-color:var(--navy-400);transform:translateY(-1px);}
    .gate-guest:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

    .gate-foot{font-size:.68rem;color:var(--text-subtle);margin-top:.95rem;line-height:1.45;}
    .gate-cancel{position:absolute;top:.9rem;right:1rem;background:rgba(255,255,255,.1);border:none;
      color:#fff;font-size:1.1rem;line-height:1;width:32px;height:32px;border-radius:50%;cursor:pointer;
      display:none;align-items:center;justify-content:center;transition:background .15s ease;}
    .gate-cancel:hover{background:rgba(255,255,255,.22);}
    #gate.can-cancel .gate-cancel{display:flex;}

    .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.32);border-top-color:#fff;
      border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media (max-width:420px){
      .gate-card{padding:1.35rem 1.15rem 1.15rem;}
      .gate-title{font-size:1.05rem;}
    }
  
    /* ---- Admin panel (full-page, multi-board) ---- */
    #adm-open{position:fixed;left:12px;bottom:12px;z-index:180;background:var(--accent);color:#fff;
      border:none;border-radius:999px;padding:9px 16px;font:800 12.5px var(--font-sans);cursor:pointer;
      box-shadow:0 6px 18px rgba(198,8,25,.35);display:none;}
    body.is-admin #adm-open{display:block;}
    #adm{position:fixed;inset:0;background:var(--surface-page);z-index:400;display:none;flex-direction:column;
      font-family:var(--font-sans);}
    body.adm-open #adm{display:flex;}
    body.adm-open #fit{display:none;}
    #adm-head{background:var(--navy-800);color:#fff;padding:11px 18px;display:flex;flex-wrap:wrap;gap:10px 14px;
      align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2;}
    #adm-head b{font-family:var(--font-display);letter-spacing:.05em;font-size:14.5px;white-space:nowrap;}
    #adm-tabs{display:flex;flex-wrap:wrap;gap:6px;}

    /* ==================================================================
       RESPONSIVE LAYOUT
       Replaces the old scale-to-fit stage. That approach shrank a fixed
       canvas, which left white gutters beside the banner and made type
       sizes unpredictable. This is a normal fluid page: the banner is
       full-bleed at every width and the tiles reflow with the viewport.
       ================================================================== */
    html,body{height:auto;overflow-x:hidden;overflow-y:auto;}
    #fit{position:static;display:block;inset:auto;overflow:visible;background:var(--surface-page);}
    #stage{transform:none!important;width:100%;max-width:none;}

    #stage .hero-inner{max-width:1280px;margin:0 auto;

    #stage main{max-width:1280px;margin:0 auto;padding:clamp(1rem,2.5vw,1.8rem) clamp(.75rem,3vw,2rem) 1rem;}
    #stage .board{max-width:none;}
    #stage footer{max-width:1280px;margin:0 auto;padding:1rem clamp(1rem,4vw,2rem) 1.4rem;}

    /* Tiles: one fluid grid that decides its own column count. */
    #stage .board-top{display:flex;justify-content:center;margin-bottom:clamp(.6rem,1.4vw,1rem);}
    #stage .board-top .tile{width:clamp(190px,22vw,260px);}
    #stage .board-grid{display:grid;width:100%;margin:0;
      grid-template-columns:repeat(auto-fit,minmax(clamp(140px,15vw,190px),1fr));
      gap:clamp(.55rem,1.1vw,.95rem);justify-content:center;}
    #stage .board-grid .tile{width:auto;}

    /* Type scales with the viewport instead of a transform. */
    .hero h1{font-size:clamp(1.4rem,3.6vw,2.6rem);}
    .hero-position{font-size:clamp(.62rem,1.15vw,.9rem);}
    .plate .dpm{font-size:clamp(1.1rem,2.4vw,1.6rem);}

    #statusbar{position:absolute;top:0;left:0;right:0;padding:10px clamp(.75rem,3vw,1.4rem);
      display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;

  /* ---- Rendering (you shouldn't need to change anything below) ---- */
  const root = document.getElementById("app-root");
  const noResults = document.getElementById("no-results");
  function domainOf(url){ try{ return new URL(url).hostname.replace(/^www\./,""); }catch{ return ""; } }
  function iconFor(app){ if(app.icon) return app.icon; if(ICONS[app.name]) return ICONS[app.name]; return null; }

  function buildIcon(app){
    const wrap=document.createElement("div"); wrap.className="tile-icon";
    const sources=[]; const primary=iconFor(app); if(primary) sources.push(primary);
    const d=domainOf(app.url);
    if(d) sources.push("https://www.google.com/s2/favicons?domain="+encodeURIComponent(d)+"&sz=64");
    if(!sources.length) return letter(wrap,app.name);
    const img=document.createElement("img"); img.alt=""; img.loading="lazy"; let i=0; img.src=sources[0];
    img.addEventListener("error",()=>{ i++; if(i<sources.length) img.src=sources[i]; else letter(wrap,app.name); });
    wrap.appendChild(img); return wrap;
  }
  function letter(wrap,name){ wrap.innerHTML=""; wrap.classList.add("letter");
    wrap.textContent=(name||"?").trim().charAt(0).toUpperCase(); return wrap; }

  function tile(app){
    const a=document.createElement("a"); a.className="tile"; a.href=app.url;
    a.target="_blank"; a.rel="noopener noreferrer";
    a.dataset.search=(app.name+" "+(app.desc||"")+" "+domainOf(app.url)).toLowerCase();

    // Icon goes in a non-clipping wrapper so a corner badge can overhang it.
    if(app.tut&&app.tutUrl){
      const q=document.createElement("a");
      q.className="tile-tut"; q.textContent="?"; q.href=app.tutUrl;
      q.target="_blank"; q.rel="noopener noreferrer";
      const cap=app.tutCap||"Tutorial Video";
      q.title=cap; q.setAttribute("aria-label",app.name+" — "+cap);
      q.addEventListener("click",e=>e.stopPropagation());
      a.appendChild(q);
    }
    const iconWrap=document.createElement("div"); iconWrap.className="tile-iconwrap";
    iconWrap.appendChild(buildIcon(app));
    const bKey=badgeKeyFor(app);
    if(bKey){
      a.id="tile-"+bKey;
      TILE_BASE_LABEL[bKey]=app.name+(app.desc?" — "+app.desc:"");
      const badge=document.createElement("span");
      badge.className="tile-badge"; badge.id="badge-"+bKey; badge.hidden=true;
      iconWrap.appendChild(badge);
    }
    a.appendChild(iconWrap);

    const body=document.createElement("div"); body.className="tile-body";
    const nm=document.createElement("div"); nm.className="tile-name"; nm.textContent=app.name;
    const ds=document.createElement("div"); ds.className="tile-desc"; ds.textContent=app.desc||domainOf(app.url);
    body.append(nm,ds); a.appendChild(body);
    return a;
  }

  function render(list){
    const apps=list||APPS;
    const old=root.querySelector(".board");
    if(old) old.remove();
    const board=document.createElement("div"); board.className="board";
    const top=document.createElement("div"); top.className="board-top";
    const grid=document.createElement("div"); grid.className="board-grid";
    if(apps.length) top.appendChild(tile(apps[0]));
    apps.slice(1).forEach(a=>grid.appendChild(tile(a)));
    board.append(top,grid);
    root.insertBefore(board,noResults);
  }

  /* Rebuild the board for the current session, then put back the things a
     rebuild would otherwise throw away: badge counts and the live search. */
  function renderBoard(){
    if(typeof admSync==="function") admSync();
    if(typeof applyPublishedApps==="function" && !admDirty) applyPublishedApps();
    render(appsForSession());
    for(const k in BADGE_TILES) setBadge(k,COUNTS[k]||0);
    if(sTop&&sTop.value.trim()) filter(sTop.value);
    if(window.__fit) window.__fit();
  }

  const sTop=document.getElementById("search-top");
  function filter(q){
    q=q.trim().toLowerCase(); let any=false;
    document.querySelectorAll(".tile").forEach(t=>{
      const m=!q||t.dataset.search.includes(q);
      t.style.display=m?"":"none"; if(m) any=true;
    });
    const top=document.querySelector(".board-top");
    if(top){ const t=top.querySelector(".tile"); top.style.display=(t&&t.style.display!=="none")?"":"none"; }
    noResults.classList.toggle("show",!any);
    document.getElementById("nr-q").textContent='"'+q+'"';
  }
  sTop.addEventListener("input",e=>filter(e.target.value));
  document.addEventListener("keydown",e=>{
    // While the sign-in gate owns the screen it also owns the keyboard.
    if(!document.documentElement.classList.contains("gate-off")) return;
    if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();sTop.focus();}
    else if(e.key==="Escape"&&document.activeElement===sTop){ sTop.value=""; filter(""); sTop.blur(); }
  });

  /* ======================================================================
     PORTAL SIGN-IN  +  NOTIFICATION BADGES
     ----------------------------------------------------------------------
     Identity comes from the SAME alignment master the rest of the suite
     uses, so one person has one identity everywhere. Three roles sign in
     here, each with the shared password FixMi already uses:

       District Manager  DM@76051         stored as an "areaCoach"
       Director of Ops   DO@76051         stored as a "director"
       Overwatch         Overwatch@76051  Rahim / IT Support

     The portal renames itself to match whoever signed in.

     Today's notifications:
       PayMi  pending invoice approvals, from PayMi's Firestore
       FixMi  open R&M jobs, from the alignment master's ticket node

     PayMi's approval chains embed the signer's directory id, which is the
     same id this sign-in resolves, so no extra mapping is needed. FixMi's
     tickets belong to STORES, not people, so its count is scoped exactly
     the way FixMi scopes its own views: by store assignment.

     Both reads are read-only and fail soft — an outage means no badge
     rather than a broken page. To add a third notification, add its tile to
     BADGE_TILES, a phrase to BADGE_PHRASE, and a counter to refreshBadges.
     ====================================================================== */

  /* ---- Things you might actually want to change ---- */
  const ALIGNMENT_API="https://alignment-api-khaki.vercel.app/api/dpm-alignment";
  const PAYMI_FS="https://firestore.googleapis.com/v1/projects/gen-lang-client-0357067758/databases/(default)/documents/invoices?pageSize=300&key=AIzaSyAxW6wajL9PH1Wlw3_QuBXgAMFgYWjkJp8";
  const ROLE_PASSWORDS={ coach:"DM@76051", director:"DO@76051", admin:"Overwatch@76051" };
  const ADMIN_EMAILS=["itsupport@dossaniparadise.com","rahim@dossaniparadise.com","deisy@dossaniparadise.com"];
  /* What the portal calls itself, per role. Anyone not signed in sees the
     default. */
  const PORTAL_NAMES={ coach:"District Manager Portal",
                       director:"Director of Operations Portal",
                       admin:"Overwatch Portal" };
  const PORTAL_DEFAULT="District Manager Portal";
  /* Which tiles wear a badge: key -> exact tile name in APPS above. */
  const BADGE_TILES={ paymi:"PayMi", fixmi:"FixMi" };
  /* C-Store operators don't run Burger King systems. These come off their
     board, and Bitrix24 takes the featured slot RBI holds for BK. */
  const CSTORE_HIDE=["RBI · Okta","Genius Back Office","PAR POS","SICOM",
                     "RSI Web","RTI Oil","Flowers"];
  const CSTORE_FEATURE="Bitrix24";
  const FIXMI_TICKETS_NODE="maintenanceTickets";
  /* FixMi calls a ticket "active" until it's Closed, which includes ones a
     tech already marked Finished. Those are done work awaiting paperwork, so
     they're deliberately left out of this badge — add "finished" back here to
     match FixMi's own Open tile exactly. */
  const FIXMI_OPEN_STATUSES=["unassigned","assigned","dispatched","waiting","in_progress"];
  const SESS_KEY="dpm_dm_portal_session"; // must match the pre-paint script in <head>
  const REFRESH_MS=5*60*1000;             // background re-check
  const FOCUS_MIN_GAP_MS=60*1000;         // don't re-check on every tab focus
  const MASTER_TTL_MS=60*1000;            // reuse a recent directory pull

  let SESSION=null, MASTER=null, masterAt=0, pollTimer=null, lastCheck=0, gateDismissable=false;
  const TILE_BASE_LABEL={};   // badge key -> "PayMi — Invoice tracking"
  const COUNTS={};            // badge key -> last known count, survives a re-render

  function badgeKeyFor(app){
    const n=((app&&app.name)||"").trim().toLowerCase();
    for(const k in BADGE_TILES) if(BADGE_TILES[k].toLowerCase()===n) return k;
    return null;
  }

  /* ---- Stored choice ---------------------------------------------------
     Either null or {email,pw,...snapshot}. The snapshot lets a
     returning DM in instantly; the credentials let us silently re-verify
     against the directory afterwards, so someone removed from the DM list
     stops getting in. ---------------------------------------------------- */
  function readStored(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||"null"); }catch(e){ return null; } }
  function writeStored(o){ try{ localStorage.setItem(SESS_KEY,JSON.stringify(o)); }catch(e){} }
  function clearStored(){ try{ localStorage.removeItem(SESS_KEY); }catch(e){} }

  /* ---- Directory ---- */
  async function fetchMaster(){
    const bust=(ALIGNMENT_API.includes("?")?"&":"?")+"_="+Date.now();
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),15000);
    try{
      const res=await fetch(ALIGNMENT_API+bust,{cache:"no-store",signal:ctl.signal});
      if(!res.ok) throw new Error("Directory returned HTTP "+res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  }
  /* One pull serves both sign-in and the FixMi count, so a fresh copy is
     reused rather than re-fetched. */
  async function loadMaster(){ MASTER=await fetchMaster(); masterAt=Date.now(); try{ checkAppVersion(); }catch(e){}
    return MASTER; }
  async function ensureMaster(){
    if(MASTER&&Date.now()-masterAt<MASTER_TTL_MS) return MASTER;
    return await loadMaster();
  }

  /* Mirrors FixMi's resolveSession — same order, same passwords — so one
     person gets one identity suite-wide. Admin is checked first: Rahim and
     IT Support must never resolve as anything else. */
  function resolveSession(email,pw){
    const lc=(email||"").trim().toLowerCase();
    if(!lc) return {error:"Enter your work email."};
    /* Password is only required for the three privileged roles; everyone
       else in the directory signs in with their email alone. */
    const emailIs=(obj,id)=>(((obj[id]||{}).email)||"").trim().toLowerCase()===lc;

    const admins=(MASTER&&MASTER.admins)||{};
    if(ADMIN_EMAILS.includes(lc)||Object.keys(admins).some(id=>emailIs(admins,id))){
      if(!pw) return {error:"Enter the Overwatch password."};
      if(pw!==ROLE_PASSWORDS.admin) return {error:"That password doesn't match the Overwatch role."};
      const a=Object.values(admins).find(x=>(((x||{}).email)||"").trim().toLowerCase()===lc);
      const known={"rahim@dossaniparadise.com":"Rahim Virani","itsupport@dossaniparadise.com":"IT Support","deisy@dossaniparadise.com":"Deisy"}[lc];
      return {email:lc,role:"admin",name:(a&&a.name)||known||"Administrator"};
    }

    const dirs=(MASTER&&MASTER.directors)||{};
    const dId=Object.keys(dirs).find(id=>emailIs(dirs,id));
    if(dId){
      return {email:lc,role:"director",name:dirs[dId].name||"Director of Operations",refId:dId};
    }

    const coaches=(MASTER&&MASTER.areaCoaches)||{};
    const cId=Object.keys(coaches).find(id=>emailIs(coaches,id));
    if(cId){
      return {email:lc,role:"coach",name:coaches[cId].name||"District Manager",refId:cId};
    }

    /* Anyone else in the directory (GMs, coordinators, accountants…) signs in
       with just their work email — no shared password to circulate. */
    const store=storeAccount(lc);
    if(store) return store;
    const person=directoryPerson(lc);
    if(person) return {email:lc, role:person.role, name:person.name, title:person.title, refId:person.refId};
    return {error:"We couldn't find that email in the Dossani directory. Check it's the address on file, or continue without signing in below."};
  }



  /* ---- Store accounts ---------------------------------------------------
     Shared store logins (Bk14429@, Pqs11@, Bkgainesville27028@…) live on the
     RESTAURANT record, not on a person: the address is `email` and the GM's
     name is `storeManager`. They get the General Manager board, and because
     the session carries the store id, the C-Store/BK split and the FixMi
     count both scope to that one store automatically. */
  function storeAccount(lc){
    const stores=(MASTER&&MASTER.restaurants)||{};
    for(const id in stores){
      const s=stores[id]||{};
      if(((s.email||"")+"").trim().toLowerCase()===lc){
        const label=(s.storeName||("Store "+(s.storeNumber||id))).trim();
        const mgr=((s.storeManager||"")+"").trim();
        return { email:lc, role:"gm", refId:id, isStore:true,
                 name:mgr||label, hasManager:!!mgr,
                 storeLabel:label, title:"General Manager" };
      }
    }
    return null;
  }
  /* ---- Everyone else in the directory ----------------------------------
     Walks the whole alignment master for a matching email so GMs, marketing
     coordinators, staff accountants and future teams resolve without being
     hard-coded. Their FindMi title drives the portal name. */
  const ROLE_TITLE_FALLBACK={generalManagers:"General Manager",managers:"General Manager",
    staff:"Team Member",repairTechnicians:"Repair Technician",vps:"Support Staff",
    admins:"Administrator",directors:"Director of Operations",areaCoaches:"District Manager"};
  /* FindMi keeps ALL support staff under `vps` for continuity, so that node
     name says nothing about a person's job — their real title is jobTitle. */
  function directoryPerson(lc){
    if(!MASTER) return null;
    /* Scan each top-level group separately so the group name (generalManagers,
       staff, …) survives however deep the member records are nested. */
    function scan(node){
      if(!node||typeof node!=="object") return null;
      if(Array.isArray(node)){ for(const n of node){ const r=scan(n); if(r) return r; } return null; }
      const em=((node.email||"")+"").trim().toLowerCase();
      if(em&&em===lc&&node.name) return node;
      for(const k in node){ const v=node[k]; if(v&&typeof v==="object"){ const r=scan(v); if(r) return r; } }
      return null;
    }
    for(const group in MASTER){
      const hit=scan(MASTER[group]);
      if(hit) return { name:hit.name,
        title:(hit.jobTitle||hit.title||hit.position||hit.department||ROLE_TITLE_FALLBACK[group]||"").trim(),
        role:(group==="generalManagers"||group==="managers")?"gm":"staff",
        dept:((hit.department||"")+"").trim(),
        refId:hit.id||null };
    }
    return null;
  }

  /* ---- PayMi ----------------------------------------------------------- */
  /* Which PayMi ids this session answers to. DMs and Directors sign with
     their directory id; Rahim and IT Support sign PayMi's Rate Verification
     step under fixed ids. */
  function paymiIdsFor(sess){
    if(!sess) return [];
    if(sess.role==="coach"||sess.role==="director") return sess.refId?[sess.refId]:[];
    if(sess.role==="admin"){
      const e=(sess.email||"").toLowerCase();
      if(e==="rahim@dossaniparadise.com") return ["rate:rahim"];
      if(e==="itsupport@dossaniparadise.com") return ["rate:it","admin:itsupport@dossaniparadise.com"];
    }
    return [];
  }

  /* Firestore REST hands back typed JSON ({stringValue:…}). Decode enough of it. */
  function fsVal(v){
    if(v==null) return null;
    if("stringValue"  in v) return v.stringValue;
    if("integerValue" in v) return Number(v.integerValue);
    if("doubleValue"  in v) return v.doubleValue;
    if("booleanValue" in v) return v.booleanValue;
    if("nullValue"    in v) return null;
    if("mapValue"     in v){ const o={}, f=(v.mapValue&&v.mapValue.fields)||{};
      for(const k in f) o[k]=fsVal(f[k]); return o; }
    if("arrayValue"   in v) return ((v.arrayValue&&v.arrayValue.values)||[]).map(fsVal);
    return null;
  }

  /* One invoice counts once, however many of its chains are waiting on me. */
  function paymiCountFor(myIds,docs){
    const ids=Array.isArray(myIds)?myIds:[myIds];
    let n=0;
    docs.forEach(d=>{
      const chains=fsVal((d.fields||{}).chains)||[];
      const waiting=chains.some(c=>{
        if(!c||c.status!=="PENDING") return false;
        const step=(c.steps||[]).find(st=>st&&st.role===c.currentStage);
        return !!step&&(step.userIds||[]).some(u=>ids.includes(u));
      });
      if(waiting) n++;
    });
    return n;
  }

  async function refreshPaymiCount(){
    const myIds=paymiIdsFor(SESSION);
    if(!myIds.length){ setBadge("paymi",0); return; }
    try{
      const res=await fetch(PAYMI_FS,{cache:"no-store"});
      if(!res.ok){
        console.warn("[PayMi] Firestore read failed: HTTP "+res.status+" — no badge shown.");
        return; // leave the last known count rather than flashing to zero
      }
      const data=await res.json();
      const docs=data.documents||[];
      const n=paymiCountFor(myIds,docs);
      console.log("[PayMi] "+docs.length+" invoices in DB · pending on me: "+n+" · me="+myIds.join("|"));
      setBadge("paymi",n);
    }catch(e){
      console.warn("[PayMi] check failed: "+((e&&e.message)||e));
    }
  }

  /* ---- FixMi -----------------------------------------------------------
     Tickets are anchored to STORES, not to people, so "my open jobs" means
     "open jobs at my stores". This mirrors FixMi's own myStoreIds() exactly
     — keep the two in sync if store assignment ever changes shape.

       District Manager  stores where assignedAreaCoachId is me
       Director          stores stamped with my id, PLUS every store under a
                         DM who reports to me (FixMi's roll-up)
       Overwatch         everything, company-wide

     DMs see all open jobs; Directors and Overwatch see only emergencies,
     since at their scope the total is noise and the emergencies are not. */
  function myStoreIds(){
    const stores=(MASTER&&MASTER.restaurants)||{};
    if(!SESSION) return [];
    if(SESSION.role==="gm") return (SESSION.refId&&stores[SESSION.refId])?[SESSION.refId]:[];
    if(SESSION.role==="admin") return Object.keys(stores);
    if(SESSION.role==="director"){
      const coaches=(MASTER&&MASTER.areaCoaches)||{};
      const mine=new Set(Object.keys(coaches)
        .filter(cid=>(coaches[cid]||{}).assignedDirectorId===SESSION.refId));
      return Object.keys(stores).filter(r=>{
        const s=stores[r]||{};
        return s.assignedDirectorId===SESSION.refId||mine.has(s.assignedAreaCoachId);
      });
    }
    if(SESSION.role==="coach")
      return Object.keys(stores).filter(r=>(stores[r]||{}).assignedAreaCoachId===SESSION.refId);
    return [];
  }

  /* ---- Division / C-Store board ----------------------------------------
     Rather than keeping a list of C-Store people in sync by hand, the board
     is derived: if none of the stores you're responsible for is a Burger
     King, you get the C-Store board. Add or move a store in FindMi and this
     follows automatically.

     storeDivision() is copied from FindMi so all three apps classify a store
     identically — division is a real field on the record, with name-matching
     only as a fallback for stores nobody has tagged yet. KEEP IN SYNC. */
  const DIVISION_KEYS=["bk","cstore","carwash","subway","other"];
  const DIVISION_RULES=[
    { key:"bk",      test:n=>/burger\s*king|\bbk\b/i.test(n) },
    { key:"subway",  test:n=>/subway/i.test(n) },
    { key:"carwash", test:n=>/car\s*wash|\bwash\b/i.test(n) },
    { key:"cstore",  test:n=>/\bstop\b|quick\s*stop|travel\s*stop|truck\s*stop/i.test(n) },
  ];
  function storeDivision(rest){
    const d=((rest&&rest.division)||"").trim();
    if(d&&DIVISION_KEYS.includes(d)) return d;
    const n=((rest&&rest.storeName)||"").trim();
    for(const r of DIVISION_RULES) if(r.test(n)) return r.key;
    return "other";
  }

  /* Deliberately fails toward the FULL board. Hiding a tool someone needs is
     worse than showing one they don't, so anything we can't classify — no
     session, no directory yet, no stores assigned — gets everything. */
  function isCStoreUser(){ if(true) return sessionDivision()!=="bk";
    if(window.__admForceCStore===true) return true;
    if(window.__admForceCStore===false && SESSION && SESSION.refId==="__preview__") return false;
    if(!SESSION) return false;
    if(SESSION.role==="admin") return false;          // Overwatch spans both
    if(!MASTER) return SESSION.cstore===true;         // restored verdict, pre-fetch
    const stores=MASTER.restaurants||{};
    const ids=myStoreIds();
    if(!ids.length) return false;
    return !ids.some(id=>storeDivision(stores[id])==="bk");
  }

  /* An app carrying only:"cstore" (or only:"bk") appears on that board alone.
     Everything without the flag shows on both. */
  /* The board for one role in one division. `only` may name a single division
     or several ("bk,subway"); no flag means every division. */
  function appsFor(role,div,dept){
    dept=(dept||"").trim().toLowerCase();
    const list=APPS.filter(a=>{
      if(a.roles&&a.roles.length&&(!role||a.roles.indexOf(role)<0)) return false;
      /* A tile flagged for departments belongs to those support-staff teams
         only — Overwatch still sees everything. */
      if(a.depts&&a.depts.length&&role!=="admin"){
        if(role!=="staff") return false;
        if(!dept||a.depts.map(d=>String(d).trim().toLowerCase()).indexOf(dept)<0) return false;
      }
      if(!a.only) return true;
      return String(a.only).split(",").map(s=>s.trim()).indexOf(div)>=0;
    });
    if(div==="bk"||role==="admin") return list;
    const kept=list.filter(a=>!CSTORE_HIDE.includes(a.name));
    const feat=kept.find(a=>a.name===CSTORE_FEATURE);
    return feat?[feat,...kept.filter(a=>a!==feat)]:kept;
  }
  function sessionDivision(){
    if(window.__admDivision) return window.__admDivision;
    if(!SESSION) return "bk";
    if(SESSION.role==="admin") return "bk";
    if(!MASTER) return SESSION.cstore===true?"cstore":"bk";
    const stores=MASTER.restaurants||{}, ids=myStoreIds();
    if(!ids.length) return "bk";
    const divs=ids.map(id=>storeDivision(stores[id]));
    if(divs.indexOf("bk")>=0) return "bk";       /* mixed patch = full board */
    return divs[0]||"bk";
  }
  function appsForSession(){ return appsFor((SESSION&&SESSION.role)||null, sessionDivision(), (SESSION&&SESSION.dept)||""); }
  function wantsEmergenciesOnly(){
    return !!SESSION&&(SESSION.role==="director"||SESSION.role==="admin");
  }

  function fixmiCount(){
    if(!SESSION||!MASTER) return 0;
    const tickets=MASTER[FIXMI_TICKETS_NODE]||{};
    const emergencyOnly=wantsEmergenciesOnly();
    // Overwatch is company-wide, so no store filter at all — that also catches
    // any ticket whose store has since been removed from the directory.
    const companyWide=SESSION.role==="admin";
    const mine=companyWide?null:new Set(myStoreIds());
    if(mine&&!mine.size) return 0;
    let n=0;
    for(const id in tickets){
      const t=tickets[id]||{};
      if(!FIXMI_OPEN_STATUSES.includes(t.status)) continue;
      if(emergencyOnly&&t.priority!=="emergency") continue;
      if(mine&&!mine.has(t.storeId)) continue;
      n++;
    }
    return n;
  }

  async function refreshFixmiCount(){
    if(!SESSION){ setBadge("fixmi",0); return; }
    try{
      await ensureMaster();
      const n=fixmiCount();
      console.log("[FixMi] "+(wantsEmergenciesOnly()?"open emergencies":"open jobs")+
                  " for "+SESSION.role+": "+n);
      setBadge("fixmi",n);
    }catch(e){

  }

  /* ---- Badges ---- */
  const BADGE_PHRASE={
    paymi:n=>n===1?"1 invoice pending your approval":n+" invoices pending your approval",
    fixmi:n=>wantsEmergenciesOnly()
      ?(n===1?"1 open emergency":n+" open emergencies")
      :(n===1?"1 open job":n+" open jobs"),
  };

  function setBadge(key,n){
    const count=Number(n)||0;

  /* ---- Gate ------------------------------------------------------------ */
  const gateEl=document.getElementById("gate");
  const gEmail=document.getElementById("gate-email");
  const gPw=document.getElementById("gate-pw");
  const gErr=document.getElementById("gate-err");
  const gBtn=document.getElementById("gate-btn");

  const gCancel=document.getElementById("gate-cancel");

  function gateOpen(){ return !document.documentElement.classList.contains("gate-off"); }

  function openGate(canCancel){
    gateDismissable=!!canCancel;
    gateEl.classList.toggle("can-cancel",gateDismissable);
    document.documentElement.classList.remove("gate-off");
    const fit=document.getElementById("fit");
    if(fit){ fit.setAttribute("aria-hidden","true"); try{ fit.inert=true; }catch(e){} }
    showErr("");
    setTimeout(()=>{ (gEmail.value?gPw:gEmail).focus(); },60);
  }

  function closeGate(){
    document.documentElement.classList.add("gate-off");
    const fit=document.getElementById("fit");
    if(fit){ fit.removeAttribute("aria-hidden"); try{ fit.inert=false; }catch(e){} }
    gPw.value="";
  }

  function showErr(msg){
    gErr.textContent=msg||"";
    gErr.classList.toggle("show",!!msg);
  }
  function busy(on){
    gBtn.disabled=on; gEmail.disabled=on; gPw.disabled=on; 
    gBtn.innerHTML=on?'<span class="spin"></span>Checking…':"Sign In";
  }

  async function doSignIn(){
    if(gBtn.disabled) return;
    const email=gateEmailValue(), pw=gPw.value;
    showErr("");
    if(!email){ showErr("Enter your work email."); return; }  /* password requirement is decided per-role by resolveSession */
    busy(true);
    try{ await loadMaster(); }
    catch(e){
      busy(false);
      showErr("Couldn't reach the directory to check your sign-in. Check your connection and try again, or continue without signing in.");
      return;
    }
    const sess=resolveSession(email,pw);
    busy(false);
    if(sess.error){ showErr(sess.error); gPw.select(); return; }
    SESSION=sess;
    SESSION.cstore=isCStoreUser();
    writeStored({email:sess.email,pw:pw,name:sess.name,role:sess.role,
                 refId:sess.refId||null,cstore:SESSION.cstore});
    closeGate(); renderWho(); renderBoard(); startNotifications(); _booted=true; stampLoadedAt(); showWeather();
  }

  function signOut(){
    SESSION=null; MASTER=null; masterAt=0; stopNotifications(); clearBadges();
    clearStored();
    document.documentElement.classList.remove("gate-off");
    gEmail.value=""; gPw.value="";

  const EMAIL_DOMAIN="@dossaniparadise.com";
  /* The box takes a username; the domain sits beside it. Paste a whole
     address and we quietly drop the domain rather than build a broken one. */
  function gateEmailValue(){
    let v=(gEmail.value||"").trim().toLowerCase();
    if(!v) return "";
    v=v.replace(/@.*$/,"");
    return v?v+EMAIL_DOMAIN:"";
  }
  /* The password box only exists for the three Overwatch admins. It appears
     as soon as one of their addresses is typed and disappears the moment the
     address changes, so nobody else is ever asked for a password. */
  const gPwWrap=document.getElementById("gate-pwwrap");
  function syncPwField(){
    const needs=ADMIN_EMAILS.indexOf(gateEmailValue())>=0;
    gPwWrap.hidden=!needs;
    if(!needs) gPw.value="";
  }
  gEmail.addEventListener("input",syncPwField);
  gEmail.addEventListener("change",syncPwField);
  syncPwField();
  gBtn.addEventListener("click",doSignIn);
  
  
  [gEmail,gPw].forEach(el=>el.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ e.preventDefault(); doSignIn(); }

  /* Keep Tab inside the dialog while it owns the screen, and let Esc back out
     only when there is a previous choice to fall back to. */
  gateEl.addEventListener("keydown",e=>{
    
    if(e.key!=="Tab") return;
    const f=[...gateEl.querySelectorAll("button,input")].filter(el=>!el.disabled&&el.offsetParent!==null);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  });

  /* ---- Portal identity ---------------------------------------------------
     The portal takes the name of whoever is signed in. The hero heading is
     the one that matters visually — the top bar is hidden by the
     fit-to-window stage — but the tab title and top bar follow along so a
     bookmarked tab and a non-scaled view read correctly too. */
  function portalName(){
    if(!SESSION) return PORTAL_DEFAULT;
    if(PORTAL_NAMES[SESSION.role]) return PORTAL_NAMES[SESSION.role];
    const t=(SESSION.title||"").trim();
    if(t) return /portal$/i.test(t)?t:t+" Portal";
    return PORTAL_DEFAULT;
  }
  /* Local clock, so it matches the greeting people expect wherever they are.
     Morning to noon, afternoon to 5, evening after that. */
  function timeGreeting(d){
    const hr=(d||new Date()).getHours();
    if(hr<12) return "Good morning";
    if(hr<17) return "Good afternoon";
    return "Good evening";
  }
  /* Stores with no manager on file are greeted by store name, so the line
     still reads naturally instead of "Good morning, Burger King #14429". */
  function greetingLine(){
    if(!SESSION) return "";
    const anon=SESSION.isStore&&!SESSION.hasManager;
    const first=anon ? SESSION.storeLabel
                     : (((SESSION.name||"").trim().split(/\s+/)[0])||"there");
    return timeGreeting()+", "+first;
  }
  
  /* ---- Status bar ------------------------------------------------------
     Left: when this copy of the page was loaded, so a stale tab is obvious
     at a glance. Right: the store's ZIP and current conditions, for store
     accounts only. Both are computed once per page load — no timers, so an
     idle tab costs nothing. */
  function stampLoadedAt(){
    const el=document.getElementById("loadedat"); if(!el) return;
    const d=new Date();
    el.textContent="Loaded "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+
      " · "+d.toLocaleDateString([],{month:"short",day:"numeric"});
  }
  /* WMO weather codes -> label + icon key. */
  const WX_CODE={
    0:["Clear","sun"],1:["Mainly clear","sun"],2:["Partly cloudy","partly"],3:["Overcast","cloud"],
    45:["Fog","fog"],48:["Rime fog","fog"],
    51:["Light drizzle","drizzle"],53:["Drizzle","drizzle"],55:["Heavy drizzle","drizzle"],
    56:["Freezing drizzle","sleet"],57:["Freezing drizzle","sleet"],
    61:["Light rain","rain"],63:["Rain","rain"],65:["Heavy rain","rain"],
    66:["Freezing rain","sleet"],67:["Freezing rain","sleet"],
    71:["Light snow","snow"],73:["Snow","snow"],75:["Heavy snow","snow"],77:["Snow grains","snow"],
    80:["Light showers","showers"],81:["Showers","showers"],82:["Heavy showers","showers"],
    85:["Snow showers","snow"],86:["Snow showers","snow"],
    95:["Thunderstorm","storm"],96:["Thunderstorm","storm"],99:["Thunderstorm","storm"]
  };
  /* Inline SVG — crisp at any size and takes the bar's colour, unlike emoji. */
  function wxIcon(key,day){
    const s='stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
    const cloud='<path d="M17.5 17H7a3.4 3.4 0 0 1-.3-6.8A5 5 0 0 1 16.3 11.4 3.1 3.1 0 0 1 17.5 17Z" '+s+'/>';
    const sun='<circle cx="12" cy="12" r="4" '+s+'/><path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M18.8 5.2l-1.5 1.5M6.7 17.3l-1.5 1.5" '+s+'/>';
    const moon='<path d="M18.5 14.8A7.2 7.2 0 0 1 9.7 6a7.6 7.6 0 1 0 8.8 8.8Z" '+s+'/>';
    const drops=n=>{let o="";for(let i=0;i<n;i++)o+='<path d="M'+(8.5+i*3.1)+' 19v2.4" '+s+'/>';return o;};
    const map={
      sun: day?sun:moon,
      partly:(day?'<circle cx="8.2" cy="7.6" r="2.9" '+s+'/>':'<path d="M10.8 9.4A4.3 4.3 0 0 1 6.6 4.1a4.6 4.6 0 1 0 5.1 5.3Z" '+s+'/>')+cloud,
      cloud: cloud,
      fog: cloud+'<path d="M5 20h6M13 20h6" '+s+'/>',
      drizzle: cloud+drops(2), rain: cloud+drops(3), showers: cloud+drops(2),
      sleet: cloud+drops(2)+'<path d="M15.2 19.4l1.2 1.2" '+s+'/>',
      snow: cloud+'<path d="M9 20h.01M12.4 21h.01M15.8 20h.01" '+s+' stroke-width="2.4"/>',
      storm: cloud+'<path d="M12.8 18.4 10.6 21.6h2.8l-2 3" '+s+'/>'
    };
    return '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">'+(map[key]||cloud)+'</svg>';
  }
  function myStore(){
    if(!SESSION||!SESSION.isStore||!MASTER) return null;
    return (MASTER.restaurants||{})[SESSION.refId]||null;
  }
  function zipOf(s){
    const m=String((s&&s.address)||"").match(/\b(\d{5})(?:-\d{4})?\b/);
    return m?m[1]:"";
  }
  /* Weather is only useful to someone tied to a building.
       store accounts  -> their own store's ZIP + conditions
       support staff   -> the office ZIP
       DM / DO / admin -> nothing; they move between sites all day. */
  const OFFICE_ZIP="76051", OFFICE_LAT=32.9343, OFFICE_LON=-97.0781;
  function wxTarget(){
    if(!SESSION) return null;
    if(SESSION.isStore){
      const s=myStore(); if(!s) return null;
      return {zip:zipOf(s), lat:s.latitude, lon:s.longitude};
    }
    if(SESSION.role==="staff") return {zip:OFFICE_ZIP, lat:OFFICE_LAT, lon:OFFICE_LON};
    return null;
  }
  function showWeather(){
    const el=document.getElementById("wx"); if(!el) return;
    const t=wxTarget();
    if(!t){ el.classList.remove("show"); return; }
    if(t.zip){ el.textContent=t.zip; el.classList.add("show"); }
    if(!(t.lat&&t.lon)) return;
    const url="https://api.open-meteo.com/v1/forecast"+
      "?latitude="+encodeURIComponent(t.lat)+"&longitude="+encodeURIComponent(t.lon)+
      "&current=temperature_2m,apparent_temperature,precipitation,weather_code,is_day"+
      "&daily=precipitation_probability_max&forecast_days=1&timezone=auto"+
      "&temperature_unit=fahrenheit&precipitation_unit=inch";
    fetch(url).then(r=>r.ok?r.json():null).then(j=>{
      const c=j&&j.current; if(!c) return;
      const meta=WX_CODE[c.weather_code]||["","cloud"];
      const pop=((j.daily||{}).precipitation_probability_max||[])[0];
      const now=c.precipitation||0;
      const bits=[Math.round(c.temperature_2m)+"°"];
      if(meta[0]) bits.push(meta[0]);
      if(now>0.005) bits.push(now.toFixed(2)+'" now');
      else if(pop!=null&&pop>=10) bits.push(pop+"%");
      el.innerHTML='<span class="wxi">'+wxIcon(meta[1],c.is_day!==0)+'</span>'+
                   '<span class="t">'+(t.zip?t.zip+" · ":"")+bits.join(" · ")+'</span>';
      el.title=(meta[0]||"")+" · feels like "+Math.round(c.apparent_temperature)+"°";
      el.classList.add("show");
    }).catch(()=>{});
  }

  /* ---- Boot ------------------------------------------------------------ */
  async function bootPortal(){
    const saved=readStored();

    

    if(saved&&saved.email){
      // Trust the stored snapshot immediately so the board is usable offline
      // and there is no login flash, then quietly confirm it still holds.
      SESSION={email:saved.email,role:saved.role||"coach",name:saved.name||"District Manager",
        refId:saved.refId||null,cstore:saved.cstore===true,title:saved.title||"",dept:saved.dept||"",
        isStore:!!saved.isStore,storeLabel:saved.storeLabel||"",hasManager:!!saved.hasManager};
      closeGate(); renderWho(); renderBoard(); startNotifications();
      try{
        await loadMaster();
        const sess=resolveSession(saved.email,saved.pw||"");
        if(sess.error){                      // removed from the list, or password rotated
          SESSION=null; stopNotifications(); clearBadges(); clearStored();
          renderWho(); openGate(false); showErr(sess.error);
        }else{
          // Directory may have moved this person, or re-tagged their stores.
          const was=SESSION.cstore;
          SESSION=sess; SESSION.cstore=isCStoreUser();
          writeStored({email:sess.email,pw:saved.pw,name:sess.name,role:sess.role,
                       refId:sess.refId||null,cstore:SESSION.cstore});
          renderWho();
          if(SESSION.cstore!==was) renderBoard();
          refreshBadges();
        }
      }catch(e){
        console.warn("[Portal] Couldn't re-verify sign-in (offline?) — keeping the saved session.");
      }
      return;
    }

    renderWho();
    openGate(false);
  }

  renderBoard();
  bootPortal();

  <script>window.addEventListener("pageshow",function(e){if(e.persisted)location.reload();});
  /* ======================================================================
     ADMIN PANEL — itsupport@, rahim@, deisy@
     Edits the APPS list live (order, links, icons, who sees what) and
     publishes by downloading a new index.html with APPS rewritten.
     Deisy and Rahim are reminded to send the file to IT Support to upload.
     ====================================================================== */

  /* ======================================================================
     SAVING TO THE ALIGNMENT DATABASE
     ----------------------------------------------------------------------
     Everything the portal owns lives under ONE node, portalConfig, so it can
     never collide with the directory or FixMi's tickets:

       portalConfig/apps       the tile list (array)
       portalConfig/updatedAt  ISO timestamp
       portalConfig/updatedBy  who published
       portalConfig/schema     bumped if the tile shape ever changes

     One write per publish, one path, whole node replaced — no partial state
     and nothing scattered across the tree. Reads fail soft: if the node is
     missing or malformed the portal quietly uses the built-in list below,
     so a bad save can never leave anyone with a blank board.
     ====================================================================== */
  const PORTAL_NODE="portalConfig";
  const PORTAL_SCHEMA=1;
  /* Must match a write role the alignment API accepts (FixMi uses its own). */
  const PORTAL_WRITE_PASSWORD="rm123";

  /* ======================================================================
     ALWAYS-LATEST (cache busting)
     ----------------------------------------------------------------------
     Same trick FindMi and FixMi use: the newest build publishes its version
     to the shared database; any client running an older build quietly
     reloads itself from a cache-busting ?v= URL.

     Deliberately NOT the admins/appMeta node those two share — their version
     numbers are far ahead of this app's, so pointing here would make the
     portal think it was permanently stale and reload forever. The portal
     keeps its own stamp under portalConfig/appMeta.

     Invisible by design: on arrival it swaps itself out before anyone has
     started working. If a new build lands while the tab is already open it
     waits, and refreshes the moment the person tabs away and comes back —
     never yanking the page out from under a click.
     ====================================================================== */
  var APP_VERSION="3.6";
  (function(){ var fv=document.getElementById("footer-ver"); if(fv) fv.textContent="v"+APP_VERSION; })();
  const VER_PATH=PORTAL_NODE+"/appMeta";
  let _verPublished=false, _updatePending=false, _booted=false;
  function cmpVer(a,b){
    const pa=String(a||"0").split(".").map(Number), pb=String(b||"0").split(".").map(Number);
    for(let i=0;i<Math.max(pa.length,pb.length);i++){const x=pa[i]||0,y=pb[i]||0;if(x!==y)return x>y?1:-1;}
    return 0;
  }
  function hardReload(v){
    /* One reload per version, so a bad stamp can never loop the browser. */
    const key="dpmReloadedFor";
    try{ if(sessionStorage.getItem(key)===String(v)) return; sessionStorage.setItem(key,String(v)); }catch(e){}
    const u=new URL(location.href);
    u.searchParams.set("v",v);
    location.replace(u.toString());
  }
  function checkAppVersion(){
    const server=(((MASTER||{})[PORTAL_NODE]||{}).appMeta||{}).version;
    if(!server||cmpVer(APP_VERSION,server)>0){
      if(_verPublished) return;
      _verPublished=true;
      const updates={}; updates[VER_PATH]={version:APP_VERSION,updatedAt:new Date().toISOString()};
      fetch(ALIGNMENT_API,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({password:PORTAL_WRITE_PASSWORD,updates})})
        .catch(()=>{_verPublished=false;});
    }else if(cmpVer(server,APP_VERSION)>0){
      if(!_booted){ hardReload(server); }      /* just arrived — swap now */
      else { _updatePending=server; }          /* mid-session — wait for a lull */
    }
  }
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"&&_updatePending) hardReload(_updatePending);
  });

  function portalConfigFromMaster(){
    const n=MASTER&&MASTER[PORTAL_NODE];
    if(!n||!Array.isArray(n.apps)||!n.apps.length) return null;
    const clean=n.apps.filter(a=>a&&typeof a.name==="string"&&typeof a.url==="string"&&/^https?:\/\//.test(a.url));
    return clean.length?clean:null;
  }
  /* Swap the built-in tiles for the published ones, in place, so every
     existing reference to APPS keeps working. */
  function applyPublishedApps(){
    const saved=portalConfigFromMaster();
    if(!saved) return false;
    APPS.length=0; saved.forEach(a=>APPS.push(a));
    return true;
  }
  async function savePortalConfig(who){
    const payload={ schema:PORTAL_SCHEMA, apps:APPS.map(a=>{
        const o={name:a.name,url:a.url,desc:a.desc||""};
        if(a.icon) o.icon=a.icon;
        if(a.only) o.only=a.only;
        if(a.roles&&a.roles.length) o.roles=a.roles.slice();
        if(a.depts&&a.depts.length) o.depts=a.depts.slice();
        if(a.tut){ o.tut=true; o.tutUrl=a.tutUrl||""; if(a.tutCap) o.tutCap=a.tutCap; }
        return o;
      }), updatedAt:new Date().toISOString(), updatedBy:who||"unknown" };
    /* Write the parts, not the whole node, so the version stamp written by
       checkAppVersion() below survives a publish. */
    const updates={};
    updates[PORTAL_NODE+"/apps"]=payload.apps;
    updates[PORTAL_NODE+"/schema"]=payload.schema;
    updates[PORTAL_NODE+"/updatedAt"]=payload.updatedAt;
    updates[PORTAL_NODE+"/updatedBy"]=payload.updatedBy;
    const r=await fetch(ALIGNMENT_API,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:PORTAL_WRITE_PASSWORD,updates})});
    if(!r.ok){ let m="HTTP "+r.status; try{ m=(await r.json()).error||m; }catch(e){} throw new Error(m); }
    return payload;
  }

  const ADM_UPLOADER="itsupport@dossaniparadise.com";
  const ADM_ROLES=[["coach","District Mgr"],["director","Director"],["gm","General Mgr"],["staff","Staff"],["admin","Overwatch"]];
  let admDirty=false, admGroup="gm", admNewPendingIndex=null;

  function admIsAdmin(){ return !!SESSION && SESSION.role==="admin"; }
  function admSync(){ document.body.classList.toggle("is-admin", admIsAdmin()); }

  /* Each board shows exactly the tiles a role in a division (or a
     support-staff department) would see, rendered as a small live grid so
     several divisions can sit side by side for comparison. */
  const ADM_DIVLABEL={bk:"BK",subway:"Subway",cstore:"C-Store",carwash:"Car Wash"};
  const ADM_SHORT={gm:"GM",coach:"DM",director:"DO"};
  const ADM_GROUPS=[
    {key:"gm",    label:"General Managers",           role:"gm",      divs:["bk","subway","cstore","carwash"]},
    {key:"dm",    label:"District Managers",          role:"coach",   divs:["bk","cstore"]},
    {key:"do",    label:"Directors of Operations",    role:"director",divs:["bk","cstore"]},
    {key:"staff", label:"Support Staff",               role:"staff",   divs:null},
    {key:"admin", label:"Overwatch",                   role:"admin",   divs:["bk"]},
  ];
  function admDepartments(){
    const out=[], seen={};
    const vps=(MASTER&&MASTER.vps)||{};
    for(const id in vps){
      const d=((vps[id]||{}).department||"").trim();
      if(d&&!seen[d.toLowerCase()]){ seen[d.toLowerCase()]=1; out.push(d); }
    }
    return out.sort((a,b)=>a.localeCompare(b));
  }

  /* ---- Tabs ---- */
  function admBuildTabs(){
    const host=document.getElementById("adm-tabs"); if(!host) return;
    host.innerHTML="";
    ADM_GROUPS.forEach(g=>{
      const b=document.createElement("button"); b.type="button"; b.textContent=g.label;
      b.className=(g.key===admGroup?"on":"");
      b.onclick=()=>{ admGroup=g.key; admSyncTabs(); admStaffDeptRefresh(); admRenderBoards(); };
      host.appendChild(b);
    });
  }
  function admSyncTabs(){
    document.querySelectorAll("#adm-tabs button").forEach((b,i)=>b.classList.toggle("on", ADM_GROUPS[i].key===admGroup));
    document.getElementById("adm-staffbar").hidden=(admGroup!=="staff");
  }
  function admStaffDeptRefresh(){
    const sel=document.getElementById("adm-dept"); if(!sel) return;
    const prev=sel.value, deps=admDepartments();
    sel.innerHTML=(deps.length?deps:["(directory loading…)"]).map(d=>'<option value="'+d+'">'+d+'</option>').join("");
    if(deps.length&&deps.includes(prev)) sel.value=prev;
  }

  /* ---- Boards ---- */
  function admRenderBoards(){
    const host=document.getElementById("adm-boards"); if(!host) return;
    host.innerHTML="";
    const grp=ADM_GROUPS.find(g=>g.key===admGroup)||ADM_GROUPS[0];
    host.classList.toggle("single", grp.key==="staff"||grp.key==="admin");
    if(grp.key==="staff"){
      const dept=(document.getElementById("adm-dept").value)||"";
      host.appendChild(admBuildMiniBoard("Support Staff"+(dept?" — "+dept:""),"staff","bk",dept));
      return;
    }
    if(grp.key==="admin"){
      host.appendChild(admBuildMiniBoard("Overwatch (sees everything)","admin","bk",""));
      return;
    }
    grp.divs.forEach(d=>{
      host.appendChild(admBuildMiniBoard(ADM_DIVLABEL[d]+" "+ADM_SHORT[grp.role],grp.role,d,""));
    });
  }
  function admBuildMiniBoard(title,role,div,dept){
    const wrap=document.createElement("div"); wrap.className="mini-board";
    const head=document.createElement("header");
    const b=document.createElement("b"); b.textContent=title;
    const vis=appsFor(role,div,dept);
    const span=document.createElement("span"); span.textContent=vis.length+(vis.length===1?" tile":" tiles");
    head.append(b,span); wrap.appendChild(head);
    const grid=document.createElement("div"); grid.className="mini-grid";
    if(!vis.length){
      const e=document.createElement("div"); e.className="mini-empty"; e.textContent="No tiles for this view yet.";
      grid.appendChild(e);
    }else{
      const ctx={role:role,div:div,dept:dept||""};
      vis.forEach((a,pos)=>grid.appendChild(admMiniTile(a,pos,vis,ctx)));
    }
    wrap.appendChild(grid);
    return wrap;
  }
  function admMiniLetter(name){
    const d=document.createElement("div"); d.className="mt-letter";
    d.textContent=(name||"?").trim().charAt(0).toUpperCase();
    return d;
  }
  /* Same icon chain as the live board (tile explicit icon → embedded ICONS
     data-URL → Google favicon), falling back to a letter, so the editor
     looks exactly like what people will see. */
  function admMiniIcon(a){
    const sources=[];
    const primary=iconFor(a); if(primary) sources.push(primary);
    const d=domainOf(a.url);
    if(d) sources.push("https://www.google.com/s2/favicons?domain="+encodeURIComponent(d)+"&sz=64");
    if(!sources.length) return admMiniLetter(a.name);
    const img=document.createElement("img"); img.alt=""; img.loading="lazy";
    let i=0; img.src=sources[0];
    img.addEventListener("error",function(){ i++; if(i<sources.length) img.src=sources[i]; else img.replaceWith(admMiniLetter(a.name)); });
    return img;
  }
  /* X on a tile removes it from THIS board only, by taking the board's
     division (or department) out of the app's visibility. Deleting an app
     everywhere lives on the Delete button inside the edit modal. */
  const ADM_ALL_DIVS=["bk","subway","cstore","carwash"];
  function admRemoveFromBoard(a,ctx){
    if(ctx.role==="admin"){
      if(!confirm('Overwatch sees everything, so removing "'+a.name+'" here deletes it from every board. Delete it?')) return;
      APPS.splice(APPS.indexOf(a),1); admChanged(); return;
    }
    if(ctx.role==="staff"&&ctx.dept){
      const dlist=admDepartments();
      if(!dlist.length){ alert("The directory hasn't loaded yet, so departments can't be edited."); return; }
      if(!confirm('Remove "'+a.name+'" from the '+ctx.dept+' board?')) return;
      let depts=(a.depts&&a.depts.length)?a.depts.slice():dlist.slice();
      depts=depts.filter(d=>d.toLowerCase()!==ctx.dept.toLowerCase());
      if(!depts.length){
        if(!confirm('That was its last department — delete "'+a.name+'" from every board instead?')) return;
        APPS.splice(APPS.indexOf(a),1); admChanged(); return;
      }
      a.depts=depts; admChanged(); return;
    }
    /* Division boards (GM / DM / DO tabs). Division visibility is shared
       across roles, so this hides it from every board of that division;
       per-role visibility lives in Edit → Positions. */
    const label=ADM_DIVLABEL[ctx.div]||ctx.div;
    if(!confirm('Remove "'+a.name+'" from the '+label+' boards? (It stays on the other divisions. Use Edit → Positions to change which roles see it.)')) return;
    let divs=(a.only?String(a.only).split(",").map(s=>s.trim()).filter(Boolean):ADM_ALL_DIVS.slice());
    divs=divs.filter(d=>d!==ctx.div);
    if(!divs.length){
      if(!confirm('That was its last division — delete "'+a.name+'" from every board instead?')) return;
      APPS.splice(APPS.indexOf(a),1); admChanged(); return;
    }
    a.only=divs.join(","); admChanged();
  }
  function admMiniTile(a,pos,vis,ctx){
    const t=document.createElement("div"); t.className="mini-tile"+(pos===0?" feat":""); t.draggable=true; t.dataset.pos=pos;
    t.title="Click to edit "+a.name;
    t.appendChild(admMiniIcon(a));
    const nm=document.createElement("div"); nm.className="nm"; nm.textContent=a.name||"(untitled)";
    t.appendChild(nm);
    const x=document.createElement("button"); x.type="button"; x.className="mt-x"; x.textContent="✕";
    x.title="Remove from this board";
    x.onclick=(e)=>{ e.stopPropagation(); admRemoveFromBoard(a,ctx); };
    t.appendChild(x);
    t.addEventListener("click",()=>admEdit(APPS.indexOf(a)));
    t.addEventListener("dragstart",e=>{ t.classList.add("dragging"); e.dataTransfer.setData("text/plain",String(pos)); });
    t.addEventListener("dragend",()=>t.classList.remove("dragging"));
    t.addEventListener("dragover",e=>e.preventDefault());
    t.addEventListener("drop",e=>{
      e.preventDefault(); e.stopPropagation();
      const from=+e.dataTransfer.getData("text/plain"); if(isNaN(from)||from===pos) return;
      /* Reorder within the master list so the new placement sticks for everyone. */
      const moved=vis[from], target=vis[pos];
      const gi=APPS.indexOf(moved); APPS.splice(gi,1);
      APPS.splice(APPS.indexOf(target)+(from<pos?1:0),0,moved);
      admChanged();
    });
    return t;
  }
  function admChanged(){ admDirty=true; admRenderBoards(); admNote(); }

  /* ---- Chip helper (shared by division / role / department / tutorial pickers) ---- */
  function admChips(host,opts,isOn,onTap){
    host.innerHTML="";
    opts.forEach(([val,lab])=>{ const b=document.createElement("button"); b.type="button";

  /* ---- Edit modal (also used to add a new app — a blank app is pushed into
     APPS immediately so every chip works the same way in both modes, and is
     removed again if the person cancels without giving it a name + link) ---- */
  function admOpenModal(){ document.getElementById("adm-modal-wrap").hidden=false; }
  function admCloseModal(){ document.getElementById("adm-modal-wrap").hidden=true; }

  const ADM_DIV_OPTS=[["bk","BK"],["subway","Subway"],["cstore","C-Store"],["carwash","Car Wash"]];

  function admEdit(i){
    const a=APPS[i]; if(!a) return;
    document.getElementById("adm-modal-title").textContent=(admNewPendingIndex===i)?"Add app":"Edit app";
    document.getElementById("ae-i").value=i;
    document.getElementById("ae-del").style.display=(admNewPendingIndex===i)?"none":"";
    document.getElementById("ae-name").value=a.name||"";
    document.getElementById("ae-url").value=a.url||"";
    document.getElementById("ae-desc").value=a.desc||"";
    document.getElementById("ae-icon").value=a.icon||"";
    document.getElementById("ae-tutcap").value=a.tutCap||"";
    document.getElementById("ae-tuturl").value=a.tutUrl||"";

    const divVal=(a.only||"").split(",").map(s=>s.trim()).filter(Boolean);
    admChips(document.getElementById("ae-div"), ADM_DIV_OPTS,
      v=>divVal.indexOf(v)>=0,
      v=>{ const k=divVal.indexOf(v); if(k>=0) divVal.splice(k,1); else divVal.push(v);
           if(divVal.length) a.only=divVal.join(","); else delete a.only;
           admChanged(); admEdit(i); });

    const dlist=admDepartments();
    admChips(document.getElementById("ae-depts"),
      (dlist.length?dlist:["(directory loading…)"]).map(d=>[d,d]),
      v=>!!(a.depts&&a.depts.indexOf(v)>=0),
      v=>{ if(!dlist.length) return;
           a.depts=a.depts||[]; const k=a.depts.indexOf(v);
           if(k>=0) a.depts.splice(k,1); else a.depts.push(v);
           if(!a.depts.length) delete a.depts; admChanged(); admEdit(i); });

    admChips(document.getElementById("ae-tut"), [["yes","Tutorial: Yes"],["no","No"]],
      v=>((a.tut?"yes":"no")===v),
      v=>{ if(v==="yes") a.tut=true; else delete a.tut; admChanged(); admEdit(i); });

    admChips(document.getElementById("ae-roles"), ADM_ROLES,
      v=>!!(a.roles&&a.roles.indexOf(v)>=0),
      v=>{ a.roles=a.roles||[]; const k=a.roles.indexOf(v);
           if(k>=0) a.roles.splice(k,1); else a.roles.push(v);
           if(!a.roles.length) delete a.roles; admChanged(); admEdit(i); });

    admOpenModal();
  }
  function admNew(){

  function admCancelModal(){

  function admDel(){
    const i=+document.getElementById("ae-i").value; const a=APPS[i]; if(!a) return;
