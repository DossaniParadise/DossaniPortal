  document.getElementById("ae-save").onclick=function(){
    const i=+document.getElementById("ae-i").value; const a=APPS[i]; if(!a) return;
    const n=document.getElementById("ae-name").value.trim();
    const u=document.getElementById("ae-url").value.trim();
    if(!n||!/^https?:\/\//.test(u)){ alert("Name and a full https:// link are required."); return; }
    a.name=n; a.url=u;
    a.desc=document.getElementById("ae-desc").value.trim();
    const ic=document.getElementById("ae-icon").value.trim(); if(ic) a.icon=ic; else delete a.icon;
    const tc=document.getElementById("ae-tutcap").value.trim(); if(tc) a.tutCap=tc; else delete a.tutCap;
    const tu=document.getElementById("ae-tuturl").value.trim(); if(tu) a.tutUrl=tu; else delete a.tutUrl;
    if(a.tut&&!a.tutUrl){ alert("Add a tutorial link, or set Tutorial to No."); return; }
    admNewPendingIndex=null;
    admCloseModal(); admChanged();
  };
  document.getElementById("ae-del").onclick=admDel;
  document.getElementById("ae-cancel").onclick=admCancelModal;
  document.getElementById("adm-modal-x").onclick=admCancelModal;
  /* Clicking the dark backdrop (not the card itself) cancels, and Escape
     always offers a way out — modal first, then the admin page. */
  document.getElementById("adm-modal-wrap").addEventListener("click",function(e){
    if(e.target===this) admCancelModal();
  });
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape") return;
    if(!document.getElementById("adm-modal-wrap").hidden){ admCancelModal(); return; }
    if(document.body.classList.contains("adm-open")) document.body.classList.remove("adm-open");
  });
  document.getElementById("adm-new").onclick=admNew;

  function admNote(){
    const el=document.getElementById("adm-note"); if(!el) return;
    const me=((SESSION&&SESSION.email)||"").toLowerCase();
    if(me===ADM_UPLOADER){
      el.className="upload";
      el.innerHTML=(admDirty?"<b>Unsaved changes.</b> ":"")+"Publish saves straight to the alignment database — live for everyone right away. If that ever fails it downloads <b>index.html</b> to upload to GitHub instead.";
    }else{
      el.className="send";
      el.innerHTML=(admDirty?"<b>Unsaved changes.</b> ":"")+"Publish saves straight to the alignment database — live for everyone right away. If it can't reach the database it downloads <b>index.html</b>; email that file to <b>"+ADM_UPLOADER+"</b> to upload to GitHub.";
    }
  }
  function admSerialize(){
    const lines=APPS.map(a=>{
      let s='    { name:'+JSON.stringify(a.name)+', url:'+JSON.stringify(a.url)+', desc:'+JSON.stringify(a.desc||"");
      if(a.icon) s+=', icon:'+JSON.stringify(a.icon);
      if(a.only) s+=', only:'+JSON.stringify(a.only);
      if(a.roles&&a.roles.length) s+=', roles:'+JSON.stringify(a.roles);
      if(a.depts&&a.depts.length) s+=', depts:'+JSON.stringify(a.depts);
      if(a.tut) s+=', tut:true';
      if(a.tutCap) s+=', tutCap:'+JSON.stringify(a.tutCap);
      if(a.tutUrl) s+=', tutUrl:'+JSON.stringify(a.tutUrl);
      return s+' },';
    });
    return "const APPS = [\n"+lines.join("\n")+"\n  ];";
  }
  document.getElementById("adm-pub").onclick=async function(){
    const btn=this, me=((SESSION&&SESSION.email)||"").toLowerCase();
    btn.disabled=true; const label=btn.textContent; btn.textContent="Publishing…";
    try{
      await savePortalConfig(me);
      admDirty=false; masterAt=0;            /* force a fresh master next read */
      admNote();
      alert("Published. The new tiles are live for everyone — no upload needed.");
    }catch(err){
      /* Database write refused or unreachable: fall back to the file route so
         a publish is never simply lost. */
      try{
        const src=await (await fetch(location.href,{cache:"no-store"})).text();
        const out=src.replace(/const APPS = \[[\s\S]*?\n  \];/, ()=>admSerialize());
        const a=document.createElement("a");
        a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));
        a.download="index.html"; a.click();
      }catch(e2){}
      alert("Couldn't save to the database ("+(err.message||err)+").\n\n"+
        "Downloaded index.html instead — "+(me===ADM_UPLOADER
          ? "upload it to the DossaniPortal repo to publish."
          : "email it to "+ADM_UPLOADER+" to upload."));
    }finally{ btn.disabled=false; btn.textContent=label; }
  };
  document.getElementById("adm-reset").onclick=function(){
    if(!confirm("Discard changes and reload the published version?")) return; location.reload();
  };
  document.getElementById("adm-dept").onchange=function(){ admRenderBoards(); };
  document.getElementById("adm-open").onclick=function(){
    document.body.classList.add("adm-open");
    admBuildTabs(); admSyncTabs(); admStaffDeptRefresh(); admRenderBoards(); admNote();
  };
  document.getElementById("adm-x").onclick=function(){
    document.body.classList.remove("adm-open");
  };


  </script>
</body>
</html>
